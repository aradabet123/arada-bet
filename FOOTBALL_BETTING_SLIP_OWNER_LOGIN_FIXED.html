(() => {
  const TOTAL_MATCHES = 75;

  }
  function displayDate(key) {
    if (key === 'date-not-set') return 'DATE NOT SET';
    const [y,m,d] = key.split('-').map(Number);
    return new Date(y,m-1,d).toLocaleDateString('en-GB',{weekday:'short',day:'2-digit',month:'short',year:'numeric'});
  }

    const o = {...defaultOdds};

    clearTimeout(writeTimer);
    writeTimer = setTimeout(writeMatches, 450);
    if (!ownerUser) setStatus('Local edit saved · Owner sign-in required for cloud sync');
  }
  function applyCloud(list) {
    applyingRemote = true;
    remoteMatches = Array.isArray(list) ? list.map(m => m && typeof m === 'object' ? {...m} : m) : [];
    state = fromCloud(remoteMatches);
    rebuildPages();
    saveLocal();
    render();
    applyingRemote = false;
    setStatus('Live sync connected · ARADA BET matches loaded');
    // Add stable boardSlot metadata once, only after the authorized owner signs in.
    if (ownerUser && remoteMatches.some((m,i) => !Number.isInteger(Number(m && m.boardSlot)))) writeMatches();
  }
  function initFirebase() {
    try {
      if (!window.firebase) { setStatus('Firebase SDK could not load · Check internet connection'); return; }
      if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
      const auth = firebase.auth(); firebaseDb = firebase.database(); matchesRef = firebaseDb.ref('records/aradaBet/state/matches');
      matchesRef.on('value', snap => {
        if (snap.exists()) { cloudReady = true; applyCloud(snap.val()); }
        else { cloudReady = false; setStatus('ARADA BET cloud has no matches yet · Waiting for source data'); }
      }, err => setStatus('CLOUD READ FAILED: ' + (err.code || err.message)));
      auth.onAuthStateChanged(user => {
        ownerUser = user && user.email && user.email.toLowerCase() === OWNER_EMAIL ? user : null;
        if (ownerUser) {
          loginBtn.textContent = 'OWNER SIGNED IN';
          setStatus('Owner authenticated · Live sync enabled');
          if (remoteMatches.length) writeMatches();
        } else {
          loginBtn.textContent = 'OWNER SIGN IN';
          if (user) setStatus('WRONG GOOGLE ACCOUNT · Sign in with ' + OWNER_EMAIL);
        }
      });
      // Complete Google redirect sign-in after the browser returns to this page.
      auth.getRedirectResult().then(result => {
        if (result && result.user) {
          const email = String(result.user.email || '').toLowerCase();
          if (email !== OWNER_EMAIL) {
            setStatus('WRONG GOOGLE ACCOUNT · Required: ' + OWNER_EMAIL);
            return auth.signOut();
          }
          setStatus('Google sign-in successful · Checking owner access…');
        }
      }).catch(e => {
        console.error('Google redirect result failed:', e);
        setStatus('SIGN IN FAILED: ' + (e.code || e.message || 'Redirect sign-in failed'));
      });
      loginBtn.addEventListener('click', async () => {
        if (ownerUser) { setStatus('Owner is already signed in · Live sync enabled'); return; }
        try {
          setStatus('Opening Google sign-in…');
          await auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);
          const provider = new firebase.auth.GoogleAuthProvider();
          provider.setCustomParameters({prompt:'select_account', login_hint:OWNER_EMAIL});
          await auth.signInWithRedirect(provider);
        } catch(e) {
          console.error('Owner redirect sign-in failed:', e);
          setStatus('SIGN IN FAILED: ' + (e.code || e.message || 'Please check Firebase Authorized domains'));
        }
      });
    } catch(e) { setStatus('Firebase setup error: ' + e.message); }
  }

  document.getElementById('clearOdds').addEventListener('click', () => {
    const slots = pageRange();
    const pageDate = (window.__betSlipPageDates || [])[currentPage-1] || 'date-not-set';
    if (!confirm(`Clear team names and odds on this page (${displayDate(pageDate)})? Headings and the other pages will be kept.`)) return;
    for (const matchNo of slots) state[matchNo] = { home: '', away: '', odds: {} };
    queueWrite(); render();
  });
  document.getElementById('backupData').addEventListener('click', () => {
    const savedHeaders = {}; headerInputs.forEach(input => savedHeaders[input.id] = input.value);
    const backup = { format: 'footballBetSlipBackup', version: 1, matches: state, headers: savedHeaders };
    const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob); const link = document.createElement('a'); link.href = url; link.download = 'football-betting-slip-backup.json'; document.body.appendChild(link); link.click(); link.remove(); setTimeout(() => URL.revokeObjectURL(url), 1000);
  });
  const restoreFile = document.getElementById('restoreFile');
  document.getElementById('restoreData').addEventListener('click', () => restoreFile.click());
  restoreFile.addEventListener('change', () => {
    const file = restoreFile.files && restoreFile.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = () => { try {
      const backup = JSON.parse(String(reader.result || ''));
      if (!backup || backup.format !== 'footballBetSlipBackup' || !backup.matches || typeof backup.matches !== 'object') throw new Error('Invalid backup');
      if (!confirm('Restore this backup? It will replace the current match data and headings on this browser and cloud.')) return;
      state = backup.matches; saveLocal();
      if (backup.headers && typeof backup.headers === 'object') { headerInputs.forEach(input => { if (typeof backup.headers[input.id] === 'string') input.value = backup.headers[input.id]; }); const h={};headerInputs.forEach(input=>h[input.id]=input.value);try{localStorage.setItem(headerStorageKey,JSON.stringify(h));}catch(e){} }
      queueWrite(); render(); alert('Backup restored successfully.');
    } catch(error) { alert('Could not restore this file. Please choose a valid football-betting-slip-backup.json file.'); }
    finally { restoreFile.value = ''; } };
    reader.onerror = () => { alert('Could not read this file. Please try again.'); restoreFile.value = ''; }; reader.readAsText(file);
  });
  function makeInput(className, value, placeholder, onChange, ariaLabel, isOdds = false) {
    const input = document.createElement('input'); input.className = className; input.type = 'text'; input.value = value || ''; input.placeholder = placeholder || ''; input.setAttribute('aria-label', ariaLabel); input.autocomplete = 'off'; input.spellcheck = false;
    let acceptedValue = input.value;
    input.addEventListener('input', () => {
      const nextValue = input.value.trim();
      if (isOdds && nextValue !== '' && (!/^\d+(?:\.\d*)?$/.test(nextValue) || Number(nextValue) > 10)) { input.value = acceptedValue; return; }
      acceptedValue = input.value; onChange(input.value);
    });
    return input;
  }
  function renderPagination() {
    pagination.replaceChildren();
    const dates = window.__betSlipPageDates || [];
    for (let p = 1; p <= pageSlots.length; p++) { const button = document.createElement('button'); button.type = 'button'; button.className = 'page-btn' + (p === currentPage ? ' active' : ''); button.textContent = `${p}`; button.title = displayDate(dates[p-1] || 'date-not-set'); button.setAttribute('aria-current', p === currentPage ? 'page' : 'false'); button.addEventListener('click', () => { currentPage = p; render(); }); pagination.append(button); }
    const slots = pageRange(); const date = displayDate(dates[currentPage-1] || 'date-not-set');
    pageInfo.textContent = `${date} · Page ${currentPage} of ${pageSlots.length} · Up to 15 matches`;
  }
  function render() {
    rebuildPages(); renderPagination(); body.replaceChildren(); const slots = pageRange();
    for (const n of slots) {
      const saved = state[n] || {}; const tr = document.createElement('tr'); const matchCell = document.createElement('td'); const wrap = document.createElement('div'); wrap.className = 'match-cell';
      const ball = document.createElement('span'); ball.className = 'mini-ball'; ball.textContent = '⚽'; wrap.append(ball);
      const home = makeInput('team-input', saved.home, `Team ${n}A`, value => { if (!state[n]) state[n] = {}; state[n].home = value; queueWrite(); }, `Match ${n} home team`); wrap.append(home);
      const vs = document.createElement('span'); vs.className = 'vs'; vs.textContent = 'vs'; wrap.append(vs);
      const away = makeInput('team-input', saved.away, `Team ${n}B`, value => { if (!state[n]) state[n] = {}; state[n].away = value; queueWrite(); }, `Match ${n} away team`); wrap.append(away); matchCell.append(wrap); tr.append(matchCell);
      let marketIndex = 0;
      markets.forEach(options => { options.forEach(opt => { const cell = document.createElement('td'); const key = `${marketIndex}:${opt}`; const odds = makeInput('odds-input', saved.odds && saved.odds[key], '', value => { if (!state[n]) state[n] = {}; if (!state[n].odds) state[n].odds = {}; state[n].odds[key] = value; queueWrite(); }, `Match ${n} ${opt} text`, true); cell.append(odds); tr.append(cell); }); marketIndex++; });
      body.append(tr);
    }
  }
  render(); initFirebase();
})();
</script>
